[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-eval-harness"
version = "0.1.0"
description = "Framework-agnostic AI evaluation harness supporting multiple execution frameworks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6,<2",
  "langchain-core>=0.3,<2",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "rich>=13,<15",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dspy = ["dspy>=3,<4"]
langsmith = ["langsmith>=0.4,<1"]
otel = [
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]
adapters = ["httpx>=0.27,<1"]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<6",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.8,<1", "mypy>=1.14,<2"]

[project.scripts]
ai-eval = "langgraph_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_eval"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["langgraph_eval"]
