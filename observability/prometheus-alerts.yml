groups:
  - name: langgraph-evaluation
    rules:
      - alert: EvaluationSystemErrorRatioHigh
        expr: |
          sum(rate(evaluation_trial_errors_total[10m]))
          /
          clamp_min(sum(rate(evaluation_trials_total[10m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Evaluation system error ratio exceeds 5%
          description: Timeouts, budget failures, or system errors exceeded 5% for 10 minutes.

      - alert: EvaluationTargetLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(evaluation_target_duration_seconds_bucket[10m]))
          ) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Evaluation target p95 latency exceeds 30 seconds
          description: Adjust the threshold to the target suite SLO after collecting a baseline.

      - alert: EvaluationExportErrors
        expr: sum(increase(evaluation_export_errors_total[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Hosted evaluation export failed
          description: Inspect exporter error types and the canonical local run summary.

      - alert: EvaluationTelemetryCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Evaluation telemetry collector is unavailable
          description: Metrics and traces cannot reach the local observability backends.
